name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dpms
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dpms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dpms -d dpms_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway CI database; synthetic data only.
      DATABASE_URL: postgresql://dpms:ci_only_password@localhost:5432/dpms_test?schema=public
      TEST_DATABASE_URL: postgresql://dpms:ci_only_password@localhost:5432/dpms_test?schema=public
      SHADOW_DATABASE_URL: postgresql://dpms:ci_only_password@localhost:5432/dpms_shadow?schema=public
      WEB_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Create shadow database
        run: PGPASSWORD=ci_only_password psql -h localhost -U dpms -d dpms_test -c 'CREATE DATABASE dpms_shadow'
      - name: Apply migrations from scratch
        run: pnpm db:migrate
      - name: Validate migrations match schema (no drift)
        run: pnpm db:validate
      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration
      - name: Create least-privilege application database role
        run: |
          psql "postgresql://dpms:ci_only_password@localhost:5432/dpms_test" \
            -v app_role=dpms_app -v app_password=ci_app_only_password -v dbname=dpms_test -f ops/db-roles.sql
      - name: Verify least-privilege role (cannot wipe audit/clinical history or TRUNCATE)
        run: |
          ADMIN_DATABASE_URL="postgresql://dpms:ci_only_password@localhost:5432/dpms_test" \
          APP_DATABASE_URL="postgresql://dpms_app:ci_app_only_password@localhost:5432/dpms_test" \
          ./ops/verify-db-roles.sh
      - name: Integration tests again, with the API connecting as the least-privilege role
        env:
          TEST_APP_DATABASE_URL: postgresql://dpms_app:ci_app_only_password@localhost:5432/dpms_test?schema=public
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
      - name: Dependency vulnerability audit (production deps)
        run: pnpm audit:deps
      - name: Create end-to-end database
        run: PGPASSWORD=ci_only_password psql -h localhost -U dpms -d dpms_test -c 'CREATE DATABASE dpms_e2e'
      - name: Install Playwright browser
        run: pnpm --filter @dpms/e2e exec playwright install --with-deps chromium
      - name: Browser end-to-end and accessibility tests
        env:
          E2E_DATABASE_URL: postgresql://dpms:ci_only_password@localhost:5432/dpms_e2e?schema=public
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
